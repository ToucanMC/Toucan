# Normal server settings. Most server owners only need to edit this file.

[server]
# Address to listen on. Use 0.0.0.0 for every IPv4 interface.
bind_address = "0.0.0.0"
# TCP port used by Minecraft clients.
port = 25565
# Message displayed in the multiplayer server list. Maximum: 512 characters.
motd = "A Toucan Server"
# Maximum number of players allowed online. Must be greater than zero.
max_players = 20

[gameplay]
# Verify player identities with Mojang. Online mode is not implemented yet.
online_mode = false
# Fetch public skin texture properties for offline players.
fetch_profile_textures = true
# Options: peaceful, easy, normal, hard.
difficulty = "normal"
# Options: survival, creative, adventure, spectator.
default_game_mode = "survival"
# Number of chunks sent around each player. Range: 2-32; recommended: 6-12.
# Higher values significantly increase memory, CPU, and bandwidth usage.
view_distance_chunks = 10
# Gameplay simulation radius in chunks. Range: 2-32.
simulation_distance_chunks = 10

[world]
# World folder. Relative paths are resolved from the server working directory.
path = "world"
# Seed used when creating or generating chunks. Existing level.dat takes precedence.
seed = 0
# Options: terrain, flat.
generator = "terrain"
# Seconds between automatic world and player saves. Must be greater than zero.
autosave_interval_seconds = 300

[logging]
# Options: error, warn, info, debug, trace.
level = "info"
# Options: pretty, json.
format = "pretty"
