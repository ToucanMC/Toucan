[workspace]
members = [
    "crates/toucan-auth",
    "crates/toucan-config",
    "crates/toucan-network",
    "crates/toucan-nbt",
    "crates/toucan-observability",
    "crates/toucan-player",
    "crates/toucan-protocol",
    "crates/toucan-registry",
    "crates/toucan-region",
    "crates/toucan-server",
    "crates/toucan-world",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ToucanMC/toucan"

[workspace.dependencies]
bytes = "1.12.1"
base64 = "0.22.1"
flate2 = "1.1.9"
md-5 = "0.10.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = "1.24.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
